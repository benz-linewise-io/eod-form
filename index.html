<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EOD Report</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--g:#06c755;--bg:#f5f6f7;--card:#fff;--tx:#1c1c1e;--mut:#6b7280;--bd:#dfe2e6;--err:#d93025}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 -apple-system,system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--tx)}
  main{max-width:560px;margin:0 auto;padding:12px 16px 96px}
  h1{font-size:18px;margin:4px 0 12px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
  .seg button{border:0;padding:12px;font:inherit;font-weight:600;background:#fff;color:var(--mut)}
  .seg button.on{background:var(--g);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto;padding-top:6px}
  .chip{border:1px solid var(--bd);border-radius:999px;padding:7px 11px;background:#fff;font:inherit;font-size:14px}
  .chip.on{background:var(--g);border-color:var(--g);color:#fff}
  .hint{font-size:12px;color:var(--mut);margin-top:4px}
  .plans button{display:block;width:100%;text-align:left;margin-top:6px;padding:10px;border:1px dashed var(--g);border-radius:8px;background:#f0fff5;font:inherit}
  .err{color:var(--err);white-space:pre-line;font-size:14px;margin:8px 0}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:10px 16px}
  .bar button{width:100%;max-width:560px;display:block;margin:0 auto;padding:14px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:700}
  .bar button:disabled{opacity:.5}
  pre{white-space:pre-wrap;background:#f7f7f7;border-radius:8px;padding:10px;font:13px/1.4 ui-monospace,monospace}
  .hide{display:none}
</style>
</head>
<body>
<main>
  <h1>EOD Report <span id="who" class="hint"></span></h1>
  <div id="loading" class="card">กำลังโหลด… / Loading…</div>

  <form id="f" class="hide" autocomplete="off">
    <div class="card">
      <div class="seg" id="typeSeg">
        <button type="button" data-v="Plan" class="on">แผน / Plan</button>
        <button type="button" data-v="Actual">จริง / Actual</button>
      </div>
      <label for="date">วันที่ / Date</label>
      <input type="date" id="date" required>
      <div id="plans" class="plans hide"></div>
    </div>

    <div class="card">
      <label for="venue">สถานที่ / Venue</label>
      <select id="venue" required></select>
      <input id="venueNew" class="hide" placeholder="พิมพ์ชื่อสถานที่ใหม่ / New venue name" style="margin-top:6px">
      <div class="row">
        <div><label for="l1">L1</label><input id="l1"></div>
        <div><label for="l2">L2</label><input id="l2"></div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div><label for="hrs" id="hrsLbl">ชั่วโมงรวม / Total hr</label><input id="hrs" type="number" inputmode="decimal" min="0" step="0.5" required></div>
        <div><label for="hard">Hard hr</label><input id="hard" type="number" inputmode="decimal" min="0" step="0.5" placeholder="= total ถ้าว่าง"></div>
      </div>
      <label for="ops">จำนวน Operator</label>
      <input id="ops" type="number" inputmode="numeric" min="1" step="1" required>
    </div>

    <div class="card">
      <label>กล้อง / Cameras <b id="camCount">0</b></label>
      <input id="camFilter" placeholder="ค้นหา เช่น 29 หรือ RB">
      <div id="chips" class="chips"></div>
    </div>

    <div class="card">
      <label for="issues">ปัญหา / Issues</label>
      <textarea id="issues" placeholder="ถ้าไม่มี เว้นว่างได้"></textarea>
    </div>
    <div id="err" class="err"></div>
  </form>

  <div id="done" class="card hide">
    <b id="doneTitle">ส่งแล้ว ✅</b>
    <p id="doneNote" class="hint"></p>
    <pre id="doneMsg"></pre>
    <button type="button" id="copyBtn" class="chip">คัดลอกข้อความ / Copy</button>
  </div>
</main>
<div class="bar" id="bar"><button id="submit" type="button" disabled>ส่งรายงาน / Submit</button></div>

<script>
// ====== CONFIG: fill these in (setupForm in the Sheet shows the two FORM_ values) ======
const LIFF_ID = '2011743278-31NUxIDC';
const FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSftltvpUNho_xVKKSGknrkPdKkiZrtuvXSYnufQHAQjkWxItQ/formResponse';
const FORM_ENTRY = 'entry.287169977';
// =======================================================================================

const $ = id => document.getElementById(id);
const S = { type: 'Plan', cams: new Set(), meta: null, profile: null, idToken: null };
const PLANS_KEY = 'eod_plans_v1', DRAFT_KEY = 'eod_draft_v1';

// ---------- storage (plans are kept on the runner's phone for "Copy from your plan") ----------
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function savePlanLocally(r) {
  const cutoff = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
  const plans = lsGet(PLANS_KEY, []).filter(p => p.date >= cutoff &&
    !(p.userId === r.userId && p.date === r.date && p.venue === r.venue)); // resubmit replaces
  plans.push(r); lsSet(PLANS_KEY, plans);
}
function myPlans(date) {
  return lsGet(PLANS_KEY, []).filter(p => p.userId === S.profile.userId && p.date === date);
}

// ---------- message (keep in sync with formatMessage() in Code.gs) ----------
function fmtDateLong(ymd) {
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p = String(ymd).split('-');
  return parseInt(p[2], 10) + ' ' + M[parseInt(p[1], 10) - 1] + ' ' + p[0];
}
function fmtHr(n) { return (Math.round(n * 100) / 100) + ' hr'; }
function formatMessage(r, plan) {
  const isPlan = r.type === 'Plan', word = isPlan ? 'Planned' : 'Actual';
  const lines = ['[' + (isPlan ? 'PLAN' : 'ACTUAL') + '] ' + fmtDateLong(r.date), '',
    'Venue: ' + r.venue, 'L1: ' + (r.l1 || '-'), 'L2: ' + (r.l2 || '-'), '',
    'Total ' + word + ' Hour: ' + fmtHr(r.totalHours) + ' (Hard ' + fmtHr(r.hardHours) + ')',
    'Total ' + word + ' Operator: ' + r.operators, '',
    'Camera: ' + r.cameras.length + ' devices (' + r.cameras.join(', ') + ')'];
  if (!isPlan && plan) {
    const pct = plan.totalHours ? Math.round((r.totalHours - plan.totalHours) / plan.totalHours * 100) : null;
    lines.push('vs Plan: ' + fmtHr(plan.totalHours) + ' → ' + fmtHr(r.totalHours) +
      (pct === null ? '' : ' (' + (pct > 0 ? '+' : '') + pct + '%)') + ', ops ' + plan.operators + ' → ' + r.operators);
  }
  if (r.issues) lines.push('Issues: ' + r.issues);
  lines.push('', 'Ref: ' + r.id);
  return lines.join('\n');
}
function localPlanFor(r) { // same rule as findPlan() in Code.gs
  const plans = myPlans(r.date), exact = plans.filter(p => p.venue === r.venue);
  return exact.length ? exact[exact.length - 1] : (plans.length === 1 ? plans[0] : null);
}

// ---------- UI ----------
function renderVenues() {
  $('venue').innerHTML = '<option value="">— เลือก / Select —</option>' +
    S.meta.venues.map(x => `<option>${esc(x.name)}</option>`).join('') +
    '<option value="__new">+ สถานที่ใหม่ / New venue</option>';
}
function renderChips() {
  const q = $('camFilter').value.trim().toUpperCase();
  $('chips').innerHTML = S.meta.cameras.filter(c => !q || c.id.includes(q) || c.team.toUpperCase().includes(q) || S.cams.has(c.id))
    .map(c => `<button type="button" class="chip ${S.cams.has(c.id) ? 'on' : ''}" data-c="${c.id}">${c.id}</button>`).join('');
  $('camCount').textContent = S.cams.size ? `(${S.cams.size}): ${[...S.cams].sort().join(', ')}` : '0';
}
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

function setType(t) {
  S.type = t;
  document.querySelectorAll('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === t));
  $('hrsLbl').textContent = t === 'Plan' ? 'ชั่วโมงแผน / Planned hr' : 'ชั่วโมงจริง / Actual hr';
  loadPlans();
}

function loadPlans() {
  const box = $('plans');
  box.classList.add('hide'); box.innerHTML = '';
  if (S.type !== 'Actual' || !$('date').value) return;
  const plans = myPlans($('date').value);
  if (!plans.length) return;
  box.innerHTML = '<div class="hint">ดึงข้อมูลจากแผนของวันนี้ / Copy from your plan:</div>' +
    plans.map((p, i) => `<button type="button" data-i="${i}">${esc(p.venue)} · ${p.totalHours} hr · ${p.operators} ops · ${p.cameras.length} cams</button>`).join('');
  box.classList.remove('hide');
  box.onclick = e => { const b = e.target.closest('button'); if (b) fillFromPlan(plans[+b.dataset.i]); };
}
function fillForm(p) {
  const known = S.meta.venues.some(v => v.name === p.venue);
  $('venue').value = p.venue ? (known ? p.venue : '__new') : '';
  $('venueNew').classList.toggle('hide', !p.venue || known); if (p.venue && !known) $('venueNew').value = p.venue;
  $('l1').value = p.l1 || ''; $('l2').value = p.l2 || '';
  if (p.operators) $('ops').value = p.operators;
  S.cams = new Set(p.cameras || []); renderChips();
}
function fillFromPlan(p) { fillForm(p); $('hrs').focus(); }

function collect() {
  const venue = $('venue').value === '__new' ? $('venueNew').value.trim() : $('venue').value;
  const hrs = parseFloat($('hrs').value), hard = $('hard').value === '' ? hrs : parseFloat($('hard').value);
  return { type: S.type, date: $('date').value, venue, l1: $('l1').value.trim(), l2: $('l2').value.trim(),
    totalHours: hrs, hardHours: hard, operators: parseInt($('ops').value, 10), cameras: [...S.cams].sort(),
    issues: $('issues').value.trim() };
}

function newId(date) {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(6);
  crypto.getRandomValues(b);
  return 'EOD-' + date.replace(/-/g, '') + '-' + [...b].map(x => a[x % a.length]).join('');
}

// LINE ID tokens expire. If the form was left open too long, reload to get a fresh one (draft is kept).
function tokenFresh() {
  const d = liff.getDecodedIDToken && liff.getDecodedIDToken();
  return !!(d && d.exp && d.exp * 1000 > Date.now() + 60 * 1000);
}
function saveDraftAndReload() {
  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(Object.assign(collect(), { hrsRaw: $('hrs').value, hardRaw: $('hard').value }))); } catch (e) { }
  if (!liff.isInClient()) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
  location.reload();
}
function restoreDraft() {
  let d = null;
  try { d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null'); sessionStorage.removeItem(DRAFT_KEY); } catch (e) { }
  if (!d) return;
  setType(d.type); $('date').value = d.date; fillForm(d);
  $('hrs').value = d.hrsRaw || ''; $('hard').value = d.hardRaw || ''; $('issues').value = d.issues || '';
  $('err').textContent = 'โหลดใหม่แล้ว กดส่งอีกครั้ง / Reloaded – tap Submit again.';
}

async function submit() {
  const r = collect(), errs = [];
  if (!r.date) errs.push('ใส่วันที่');
  if (!r.venue) errs.push('เลือกสถานที่');
  if (!(r.totalHours > 0)) errs.push('ใส่ชั่วโมง');
  if (r.hardHours > r.totalHours) errs.push('Hard hr ต้องไม่เกินชั่วโมงรวม');
  if (!(r.operators >= 1)) errs.push('ใส่จำนวน Operator');
  if (!r.cameras.length) errs.push('เลือกกล้องอย่างน้อย 1 ตัว');
  if (r.cameras.length && r.totalHours > 24 * r.cameras.length) errs.push('ชั่วโมงเกิน 24 ชม./กล้อง – ตรวจตัวเลข');
  $('err').textContent = errs.join('\n');
  if (errs.length) return;

  if (!tokenFresh()) { saveDraftAndReload(); return; }
  S.idToken = liff.getIDToken();

  const btn = $('submit'); btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  r.id = newId(r.date);
  const message = formatMessage(r, r.type === 'Actual' ? localPlanFor(r) : null);
  try {
    // The form answers with an opaque response (no-cors). A network error still throws.
    const body = new URLSearchParams();
    body.append(FORM_ENTRY, JSON.stringify({ idToken: S.idToken, profile: S.profile, report: r }));
    await fetch(FORM_ACTION, { method: 'POST', mode: 'no-cors', body });
    if (r.type === 'Plan') savePlanLocally(Object.assign({ userId: S.profile.userId }, r));

    let posted = false;
    const ctx = liff.getContext && liff.getContext();
    if (liff.isInClient() && ctx && ['group', 'room', 'utou'].includes(ctx.type)) {
      try { await liff.sendMessages([{ type: 'text', text: message.slice(0, 5000) }]); posted = true; } catch (e) { }
    }
    $('f').classList.add('hide'); $('bar').classList.add('hide'); $('done').classList.remove('hide');
    $('doneMsg').textContent = message;
    $('doneNote').textContent = posted
      ? 'บันทึกแล้ว และส่งเข้ากลุ่มแล้ว / Saved and posted to the group.'
      : 'บันทึกแล้ว แต่ยังไม่ได้ส่งเข้ากลุ่ม — กดคัดลอกแล้ววางในกลุ่ม / Saved. Copy and paste into the group.';
    if (posted) setTimeout(() => liff.closeWindow(), 1500);
  } catch (e) {
    $('err').textContent = 'ส่งไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่ / Not sent – check your connection and try again.';
    btn.disabled = false; btn.textContent = 'ส่งรายงาน / Submit';
  }
}

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    S.profile = await liff.getProfile();
    S.idToken = liff.getIDToken();
    $('who').textContent = '· ' + S.profile.displayName;
    const res = await fetch('meta.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('meta.json not found');
    S.meta = await res.json();
    $('date').value = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
    renderVenues(); renderChips();
    const q = new URLSearchParams(location.search).get('type');
    if (q === 'Actual' || q === 'Plan') setType(q);
    restoreDraft();
    $('loading').classList.add('hide'); $('f').classList.remove('hide'); $('submit').disabled = false;
  } catch (e) {
    $('loading').textContent = 'โหลดไม่สำเร็จ / Could not load: ' + e.message;
  }
}

$('typeSeg').onclick = e => { const b = e.target.closest('button'); if (b) setType(b.dataset.v); };
$('date').onchange = loadPlans;
$('venue').onchange = () => {
  const v = $('venue').value, isNew = v === '__new';
  $('venueNew').classList.toggle('hide', !isNew);
  const m = S.meta.venues.find(x => x.name === v);
  if (m) { $('l1').value = m.l1; $('l2').value = m.l2; }
};
$('camFilter').oninput = renderChips;
$('chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const c = b.dataset.c; S.cams.has(c) ? S.cams.delete(c) : S.cams.add(c); renderChips();
};
$('submit').onclick = submit;
$('copyBtn').onclick = () => navigator.clipboard.writeText($('doneMsg').textContent).then(() => $('copyBtn').textContent = 'คัดลอกแล้ว ✓');
init();
</script>
</body>
</html>
